# Alembic configuration for the HawaCommand backend.
#
# Run from backend/:
#   uv run alembic upgrade head                          # apply all migrations
#   uv run alembic revision --autogenerate -m "message"  # new migration from model changes
#
# The database URL is not set here. migrations/env.py reads HAWA_DATABASE_URL
# (environment or backend/.env) through hawa_backend.core.config.Settings.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = src
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
