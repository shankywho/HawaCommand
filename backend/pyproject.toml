[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hawa-backend"
version = "0.1.0"
description = "HawaCommand Backend: API, streaming ingest, PostGIS models, and dispatch saga"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    # WebSocket support in uvicorn (GET /v1/ws/fleet); without it uvicorn rejects the upgrade
    "websockets>=13.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "orjson>=3.10.0",
    "httpx>=0.27.0",
    "pyjwt>=2.8.0",
    "greenlet>=3.0.0",
    "alembic>=1.13.0",
    # AWS layer (S3, DynamoDB, SNS, Kinesis, Secrets Manager, Step Functions); imported lazily, off unless HAWA_AWS_ENABLED
    "boto3>=1.34.0",
    # RS256 signing of the Firebase service-account assertion (FCM HTTP v1, services/push.py)
    "cryptography>=42.0.0",
    "hawa-contracts",
    "hawa-ml[llm]",
]

[project.optional-dependencies]
# Kept for older install commands; boto3 is now a core dependency.
aws = [
    "boto3>=1.34.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "aiosqlite>=0.20.0",
    "moto[dynamodb,sns,kinesis,s3,secretsmanager]>=5.0.0",
    "fakeredis>=2.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
hawa = "hawa_backend.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
hawa-contracts = { path = "contracts", editable = true }
hawa-ml = { path = "../AI-ML", editable = true }

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "tests",
    "contracts/tests",
]
pythonpath = [
    "src",
    "contracts",
]
