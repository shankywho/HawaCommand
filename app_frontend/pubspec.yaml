name: hawa_app
description: HawaCommand field and community app (drivers, inspectors, schools, citizens).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  battery_plus: ^7.1.2
  clock: ^1.1.2
  collection: ^1.19.1
  connectivity_plus: ^7.3.1
  crypto: ^3.0.7
  dio: ^5.11.1
  dio_cache_interceptor: ^4.0.7
  drift: ^2.35.1
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_map_cache: ^2.1.0
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  geolocator: ^14.1.1
  go_router: ^18.0.2
  hawa_api:
    path: packages/hawa_api
  http_cache_file_store: ^2.0.2
  image_picker: ^1.2.3
  intl: ^0.20.2
  json_annotation: ^4.12.0
  latlong2: ^0.10.1
  logging: ^1.3.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  web_socket_channel: ^3.0.3
  workmanager: ^0.10.10

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.35.1
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  freezed: ^4.0.0-dev.3
  http_mock_adapter: ^0.6.1
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/fonts/OFL.txt
    # Fixtures back the dev fake mode and the tests (docs/app/PLAN.md §6). Flavor-gating them
    # (`flavors: [dev]`) would break the tests, which run without a flavor, so they ship in all
    # builds; prod never reads them because USE_FAKE_API is false there.
    - assets/fixtures/api/
    - assets/fixtures/ws/
    - assets/images/fixtures/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari-SemiBold.ttf
          weight: 600
