# Exposure Engine Parameters & Weights (F12)
# E = max(0, C - C_safe) * Pop(cell, t) * V(cell) * dt

thresholds:
  c_safe_pm25: 60.0 # Indian National Ambient Air Quality Standard (24-hr) in ug/m3
  c_safe_pm10: 100.0 # Standard in ug/m3
  c_who_guideline_pm25: 15.0 # WHO guideline

